services:
  tensorflow_server:
    build:
      context: .
      dockerfile: tensorflow.Dockerfile
    ports:
      - "8501:8501"

  webapp:
    build:
      context: .
      dockerfile: webapp.Dockerfile
    environment:
      - CUSTOM_PREDICTION_URL=http://tensorflow_server:8501/v1/models/custom_model:predict
      - FINE_TUNE_PREDICTION_URL=http://tensorflow_server:8501/v1/models/feature_extraction_model:predict
    ports:
      - "8000:8000"
    depends_on:
      - tensorflow_server
